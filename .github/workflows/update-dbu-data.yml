name: Update DBU Football Data

on:
  schedule:
    # Runs twice a day at 06:00 and 18:00 UTC (08:00 and 20:00 Danish time)
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Scrape DBU & Update Static Data
        run: |
          python scripts/build_static_data.py

      - name: Commit and push if data updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nathaniel-data.json
          if git diff --staged --quiet; then
            echo "No changes in DBU data detected."
          else
            git commit -m "Auto-update Nathaniel DBU match data [skip ci]"
            git push
          fi
